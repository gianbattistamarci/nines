<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nines</title>
<meta name="description" content="Nines: learn site reliability engineering, one short lesson at a time.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: pressable stop cards wind down the page as one line of progress, and a score bar stays pinned
   to the top of every screen. Confident colour and solid shapes, no mascots or decoration. */
:root{
  font-size:112.5%;
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#141C2E; --muted:#4A5568; --edge:#D3DAE6; --track:#D3DAE6;
  --blue:#1F5FE0; --blue-d:#1746AB; --on-blue:#FFFFFF; --blue-soft:#E4ECFD;
  --teal:#0B7F70; --teal-d:#075E53; --on-teal:#FFFFFF;
  --grape:#6D43D9; --grape-d:#4E2CA8; --on-grape:#FFFFFF;
  --sun:#FFC83D; --sun-d:#D99A00; --on-sun:#3A2A00; --sun-soft:#FFF3CC; --sun-ring:#FFE49A; --star:#C28200; --flame:#E8590C;
  --good:#0E6E34; --good-bg:#DDF7E6; --good-solid:#1FA85B; --good-d:#157F43; --on-good:#FFFFFF;
  --bad:#A82219; --bad-bg:#FFE5E2; --bad-solid:#E5484D; --bad-d:#B4282D; --on-bad:#FFFFFF;
  --display:"Plus Jakarta Sans","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101A2E; --surface:#1B2944; --ink:#F2F6FF; --muted:#AEBCD9; --edge:#34496F; --track:#34496F;
    --blue:#5B9DFF; --blue-d:#2F6FD6; --on-blue:#06122B; --blue-soft:#20365F;
    --teal:#3CCFB9; --teal-d:#1F9E8C; --on-teal:#04241F;
    --grape:#AD92FF; --grape-d:#7B5BE0; --on-grape:#150A3A;
    --sun:#FFC83D; --sun-d:#D99A00; --on-sun:#3A2A00; --sun-soft:#3B3110; --sun-ring:#6B5613; --star:#FFC83D; --flame:#FF8A4C;
    --good:#7BE6AA; --good-bg:#12392A; --good-solid:#35C777; --good-d:#229453; --on-good:#04220F;
    --bad:#FFA39A; --bad-bg:#47201F; --bad-solid:#FF7A75; --bad-d:#D14A46; --on-bad:#2B0706;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101A2E; --surface:#1B2944; --ink:#F2F6FF; --muted:#AEBCD9; --edge:#34496F; --track:#34496F;
  --blue:#5B9DFF; --blue-d:#2F6FD6; --on-blue:#06122B; --blue-soft:#20365F;
  --teal:#3CCFB9; --teal-d:#1F9E8C; --on-teal:#04241F;
  --grape:#AD92FF; --grape-d:#7B5BE0; --on-grape:#150A3A;
  --sun:#FFC83D; --sun-d:#D99A00; --on-sun:#3A2A00; --sun-soft:#3B3110; --sun-ring:#6B5613; --star:#FFC83D; --flame:#FF8A4C;
  --good:#7BE6AA; --good-bg:#12392A; --good-solid:#35C777; --good-d:#229453; --on-good:#04220F;
  --bad:#FFA39A; --bad-bg:#47201F; --bad-solid:#FF7A75; --bad-d:#D14A46; --on-bad:#2B0706;
  color-scheme:dark;
}
:root.big{font-size:131.25%}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;font-size:1rem;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ic{width:1.3em;height:1.3em;flex:none}

.app{max-width:680px;margin-inline:auto;padding-block:0 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:20px}

/* Score bar, pinned to the top of every screen */
.hud{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.hud-row{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.1;margin:0}
.tag{font-family:var(--body);font-weight:800;font-size:.7rem;background:var(--sun);color:var(--on-sun);padding:2px 9px;border-radius:999px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:3px 12px 3px 8px;min-height:38px}
.chip b{font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;line-height:1}
.chip .lbl{font-weight:700;font-size:.8rem;color:var(--muted)}
.c-pts .ic,.c-stars .ic{color:var(--star)} .c-streak .ic{color:var(--flame)}
.c-combo{background:var(--sun);border-color:var(--sun-d);color:var(--on-sun);padding-left:12px}
.c-combo .lbl{color:var(--on-sun)}
.chip.pop{animation:pop .45s ease}
.fly{position:absolute;right:6px;top:-8px;font-family:var(--display);font-weight:800;font-size:1.1rem;color:var(--good);pointer-events:none;animation:fly 1.2s ease-out forwards}
@keyframes pop{50%{transform:scale(1.14)}}
@keyframes fly{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:translateY(-4px)}100%{opacity:0;transform:translateY(-26px)}}
@media (max-width:440px){.chip .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)} .c-combo .lbl{position:static;width:auto;height:auto;clip-path:none}}
.rank{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:.85rem;font-weight:800;color:var(--muted)}
.meter{flex:1;min-width:60px;height:12px;border-radius:6px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun);border-radius:6px}

/* Buttons: chunky and pressable */
.btn{font-family:var(--display);font-weight:700;font-size:1.1rem;line-height:1.2;border:0;border-radius:12px;padding:12px 22px;min-height:52px;cursor:pointer;
  background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge),0 3px 0 var(--edge);margin-bottom:5px}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--edge),0 1px 0 var(--edge)}
.btn-primary{background:var(--blue);color:var(--on-blue);box-shadow:0 3px 0 var(--blue-d)}
.btn-primary:active:not([disabled]){box-shadow:0 1px 0 var(--blue-d)}
.btn-primary:hover:not([disabled]){filter:brightness(1.07)}
.btn[disabled]{background:var(--track);color:var(--muted);box-shadow:none;cursor:not-allowed;transform:translateY(3px)}
.btn-small{font-size:.95rem;min-height:42px;padding:8px 16px;border-radius:12px}
.linkish{background:none;border:0;padding:6px 2px;color:var(--muted);text-decoration:underline;cursor:pointer;font-weight:700;font-size:.9rem}

/* Next-up panel */
.hero{display:flex}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:3px solid var(--edge);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.bubble p{margin:0;font-size:1.05rem}
.bubble strong{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.15;display:block}

/* The path */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;--step:26px}
@media (max-width:560px){.path{--step:0px}}
.banner{border-radius:14px;padding:16px 20px;background:var(--unit);color:var(--on-unit);box-shadow:0 3px 0 var(--unit-d);margin-block:18px 6px}
.path li:first-child .banner{margin-top:0}
.u1{--unit:var(--blue);--unit-d:var(--blue-d);--on-unit:var(--on-blue)}
.u2{--unit:var(--teal);--unit-d:var(--teal-d);--on-unit:var(--on-teal)}
.banner .k{font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.banner h2{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.1;margin:0;text-wrap:balance}
.banner p{margin:4px 0 0;font-weight:700}
.stop-li{padding-left:var(--sx, 0px)}
.conn{display:block;width:8px;height:18px;margin:5px 0 5px 39px;border-radius:4px;background:var(--track)}
.conn.on{background:var(--good-solid)}
.stop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--surface);border:3px solid var(--edge);border-radius:14px;padding:12px 16px 12px 12px;box-shadow:0 3px 0 var(--edge);margin-bottom:5px}
button.stop{cursor:pointer}
button.stop:hover{border-color:var(--blue)}
button.stop:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.stop.now{border-color:var(--blue);box-shadow:0 3px 0 var(--blue-d)}
.stop.locked{background:transparent;border-style:dashed;box-shadow:none}
.badge{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem;background:var(--track);color:var(--muted)}
.badge .ic{width:28px;height:28px}
.exam .badge{border-radius:12px}
.done .badge{background:var(--good-solid);color:var(--on-good)}
.now .badge{background:var(--blue);color:var(--on-blue);box-shadow:0 0 0 5px var(--blue-soft)}
.now.exam .badge{background:var(--grape);color:var(--on-grape)}
.stop-t{display:block;font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.2}
.stop-s{display:block;color:var(--muted);font-size:.9rem;font-weight:700}
.locked .stop-t{color:var(--muted)}
.stop-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-weight:800;font-size:.85rem;color:var(--muted);white-space:nowrap}
.go{font-family:var(--display);font-weight:700;font-size:1rem;background:var(--blue);color:var(--on-blue);border-radius:999px;padding:5px 16px}
.stars{color:var(--star);font-size:1.3rem;letter-spacing:1px;line-height:1}

.later{background:var(--surface);border:3px dashed var(--edge);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.later h2{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0}
.later ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 16px}
.later li{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:.92rem;font-weight:700;min-width:0}
.later .ic{width:18px;height:18px;margin-top:3px}

.foot{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--muted);font-size:.9rem;font-weight:700}
.save{display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good-solid)} .dot.warn{background:var(--sun-d)} .dot.bad{background:var(--bad-solid)}
.foot-r{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:3px solid var(--edge);border-radius:12px;padding:12px 16px;font-weight:700}

/* Player */
.xbtn{width:46px;height:46px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.xbtn:hover{border-color:var(--blue)}
.bar{flex:1;min-width:80px;height:22px;border-radius:11px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;min-width:0;background:var(--good-solid);border-radius:11px;transition:width .4s cubic-bezier(.3,1.4,.6,1);box-shadow:inset 0 -6px 0 var(--good-d)}
.count{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--surface);border:3px solid var(--edge);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.where{font-weight:800;font-size:.85rem;color:var(--muted);margin:0}
.q{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.25;margin:0;text-wrap:balance}
.hint{margin:0;color:var(--muted);font-size:.92rem;font-weight:700}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:62px;border:3px solid var(--edge);background:var(--surface);color:var(--ink);
  border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--edge);margin-bottom:4px}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.opt .key{width:34px;height:34px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--muted);flex:none}
.opt .key .ic{width:20px;height:20px}
.opt[aria-checked="true"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 3px 0 var(--blue-d)}
.opt[aria-checked="true"] .key{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.opt[disabled]{cursor:default;color:var(--muted)}
.opt.is-right{border-color:var(--good-solid);background:var(--good-bg);box-shadow:0 3px 0 var(--good-d);color:var(--ink)}
.opt.is-right .key{background:var(--good-solid);border-color:var(--good-solid);color:var(--on-good)}
.opt.is-wrong{border-color:var(--bad-solid);background:var(--bad-bg);box-shadow:0 3px 0 var(--bad-d);color:var(--ink)}
.opt.is-wrong .key{background:var(--bad-solid);border-color:var(--bad-solid);color:var(--on-bad)}

.sortrow{display:flex;flex-direction:column;gap:10px;border:3px solid var(--edge);border-radius:12px;padding:12px 14px;font-weight:700}
.sortrow.is-right{border-color:var(--good-solid);background:var(--good-bg)}
.sortrow.is-wrong{border-color:var(--bad-solid);background:var(--bad-bg)}
.sortrow .mark{display:flex;gap:8px;align-items:flex-start}
.sortrow.is-right .ic{color:var(--good)} .sortrow.is-wrong .ic{color:var(--bad)}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{border:2px solid var(--edge);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;font-weight:800;font-size:.92rem;cursor:pointer;min-height:42px;box-shadow:0 3px 0 var(--edge);margin-bottom:3px}
.pick button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue);box-shadow:0 3px 0 var(--blue-d)}
.pick button[disabled]{cursor:default}
.pick button[disabled][aria-pressed="false"]{color:var(--muted);box-shadow:none}

.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:slot}
.slots li{counter-increment:slot;display:flex;align-items:center;gap:12px;border:3px dashed var(--edge);border-radius:12px;padding:8px 14px;min-height:58px;font-weight:700}
.slots li::before{content:counter(slot);font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--muted);width:22px;flex:none}
.slots li.filled{border-style:solid;border-color:var(--blue);background:var(--blue-soft)}
.slots li.is-right{border-style:solid;border-color:var(--good-solid);background:var(--good-bg)}
.slots li.is-wrong{border-style:solid;border-color:var(--bad-solid);background:var(--bad-bg)}
.slots button{border:0;background:none;padding:6px 0;flex:1;text-align:left;font-weight:700;color:var(--ink);cursor:pointer;min-height:40px}
.slots button[disabled]{cursor:default}
.pool{display:flex;gap:10px;flex-wrap:wrap;min-height:50px}
.pool button{border:3px solid var(--edge);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:46px;box-shadow:0 3px 0 var(--edge);margin-bottom:4px}
.pool button:hover{border-color:var(--blue)}

.fb{border:3px solid;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.fb.ok{background:var(--good-bg);border-color:var(--good-solid)} .fb.no{background:var(--bad-bg);border-color:var(--bad-solid)}
.fb-head{display:flex;gap:12px;align-items:center}
.fb h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1;display:flex;gap:8px;align-items:center}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.fb p{margin:0}
.fb .lab{display:block;font-weight:800;font-size:.85rem;color:var(--muted)}
.fb ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.fb .note{font-weight:800;font-size:.9rem;color:var(--muted)}
.p-actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;align-items:center}
.btn-big{min-width:200px;font-size:1.2rem}
@media (max-width:520px){.p-actions .btn{flex:1}}

.intro{flex-direction:row;align-items:flex-end;gap:16px}
.intro > div{display:flex;flex-direction:column;gap:12px;min-width:0}
.intro h2,.result h2{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.15;margin:0;text-wrap:balance}
.intro p,.result p{margin:0;max-width:58ch}
@media (max-width:520px){.intro{flex-direction:column;align-items:flex-start}}
.result{align-items:center;text-align:center}
.bigstars{display:flex;gap:10px;font-size:3.2rem;line-height:1;color:var(--star)}
.bigstars span{animation:starin .5s cubic-bezier(.3,1.6,.6,1) both}
.bigstars span:nth-child(2){animation-delay:.18s} .bigstars span:nth-child(3){animation-delay:.36s}
@keyframes starin{from{opacity:0;transform:scale(.2) rotate(-40deg)}}
.bigscore{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.tally{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:0}
.tally div{background:var(--blue-soft);border-radius:12px;padding:8px 16px;min-width:0}
.tally dt{font-weight:800;font-size:.8rem;color:var(--muted)}
.tally dd{margin:0;font-family:var(--display);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
.take{background:var(--sun-soft);border-radius:12px;padding:14px 18px;text-align:left;align-self:stretch}
.take b{display:block;font-weight:800;font-size:.85rem;color:var(--muted)}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.95rem;text-align:left;align-self:stretch}
.review li{display:flex;gap:10px;align-items:flex-start}
.review .y{color:var(--good)} .review .n{color:var(--bad)}
.review .ic{margin-top:2px}
.pass{color:var(--good)} .fail{color:var(--bad)}

.unitdone{margin:0;font-family:var(--display);font-weight:800;font-size:.9rem;background:var(--sun);color:var(--on-sun);border-radius:999px;padding:4px 16px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-24px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="root"></div>

<script>
"use strict";
/* ---------------------------------------------------------------- content */
var NOTICE = ["A user would notice", "A user would not notice"];
var COURSE = [
 { n:1, title:"Does it work?", blurb:"What reliable means, seen from the user's side.", nodes:[
  { id:"l1-1", type:"lesson", code:"1.1", title:"It just works", sub:"6 questions. No experience needed.",
    intro:{ h:"Start here", p:"You never think about your banking app when it works. You only notice it on the day it lets you down. Reliability means software does what you expect, at the moment you need it. That is the whole subject. Let us warm up." },
    take:"Reliable means it does what people expect, when they need it, judged from their side.",
    qs:[
     { type:"choice", q:"You open your banking app. Your balance shows up straight away. Right now, is the app doing its job?",
       opts:[ {t:"Yes", ok:1},
              {t:"No", why:"It showed you what you asked for, quickly. That is exactly what doing its job means."},
              {t:"Impossible to say", why:"You can say. You asked for your balance and got it straight away. From where you sit, that is all that matters."} ],
       ex:"A light switch does its job when the light comes on. You do not need to see the wiring to know it worked." },
     { type:"choice", q:"You are at the till, paying with your phone. The payment screen spins for two minutes and the queue behind you grows. What is the real problem?",
       opts:[ {t:"The app was not there when you needed it", ok:1},

var LS_KEY = "reliability-line-v1";
function blank(){ return { v:1, xp:0, streak:{n:0,last:""}, done:{}, exams:{}, updatedAt:0, resetAt:0 }; }
function clean(o){
  var s = blank(); if(!o || typeof o !== "object") return s;
  s.xp = +o.xp || 0; s.updatedAt = +o.updatedAt || 0; s.resetAt = +o.resetAt || 0;
  if(o.streak && typeof o.streak === "object"){ s.streak = { n:+o.streak.n || 0, last:String(o.streak.last || "") }; }
  var k;
  if(o.done && typeof o.done === "object") for(k in o.done){ var d = o.done[k] || {}; s.done[k] = { stars:+d.stars || 0, best:+d.best || 0, plays:+d.plays || 0 }; }
  if(o.exams && typeof o.exams === "object") for(k in o.exams){ var e = o.exams[k] || {}; s.exams[k] = { best:+e.best || 0, passed:!!e.passed, tries:+e.tries || 0 }; }
  return s;
}
function merge(a, b){
  if(a.resetAt !== b.resetAt) return clean(a.resetAt > b.resetAt ? a : b);
  var m = blank(), k;
  m.resetAt = a.resetAt; m.xp = Math.max(a.xp, b.xp); m.updatedAt = Math.max(a.updatedAt, b.updatedAt);
  m.streak = (a.streak.last >= b.streak.last) ? { n:a.streak.n, last:a.streak.last } : { n:b.streak.n, last:b.streak.last };
  if(a.streak.last === b.streak.last) m.streak.n = Math.max(a.streak.n, b.streak.n);
  [a, b].forEach(function(s){
    for(k in s.done){ var d = s.done[k], c = m.done[k] || {stars:0,best:0,plays:0};
      m.done[k] = { stars:Math.max(c.stars, d.stars), best:Math.max(c.best, d.best), plays:Math.max(c.plays, d.plays) }; }
    for(k in s.exams){ var e = s.exams[k], x = m.exams[k] || {best:0,passed:false,tries:0};
      m.exams[k] = { best:Math.max(x.best, e.best), passed:x.passed || e.passed, tries:Math.max(x.tries, e.tries) }; }
  });
  return m;
}

function withTimeout(p, ms){ return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej({code:"timeout"}); }, ms); })]); }
function pushCloud(){
  if(!cloud.ref) return;
  if(cloud.writing){ cloud.dirty = true; return; }
  cloud.writing = true; paintSave();
  (function loop(){
    cloud.dirty = false;
    cloud.ref.set(JSON.parse(JSON.stringify(S))).then(function(){
      if(cloud.dirty) return loop();

    }, function(){ cloud.ok = false; cloud.failed = true; cloud.writing = false; paintSave(); });
  })();
}
function save(){ S.updatedAt = Date.now(); saveLocal(); pushCloud(); paintSave(); }
function initCloud(){
  if(!window.claude || typeof window.claude.use !== "function") return;
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
    var db = r[0], user = r[1]; if(!db || !user) return;
    return user.id().then(function(uid){
      if(!uid) return;
      var ref = db.doc("data/users/" + uid + "/progress");
      return withTimeout(ref.get(), 10000).then(function(snap){
        cloud.ref = ref;
        if(snap && snap.exists){
          var remote = clean(snap.data()), before = JSON.stringify(S), merged = merge(S, remote);
          S = merged; saveLocal();
          if(JSON.stringify(merged) !== before && !sess) renderHome();
          if(JSON.stringify(merged) !== JSON.stringify(remote)) pushCloud(); else cloud.ok = true;
        } else if(S.updatedAt > 0){ pushCloud(); } else { cloud.ok = true; }
        paintSave();
      });
    });
  }).catch(function(){ paintSave(); });
}

function h(tag, attrs){
  var e = document.createElement(tag), k, i;
  for(k in (attrs || {})){ var v = attrs[k];
    if(v == null || v === false) continue;
    if(k === "class") e.className = v; else if(k === "text") e.textContent = v;
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), v);
    else if(k === "disabled") e.disabled = true; else e.setAttribute(k, v === true ? "" : v); }
  for(i = 2; i < arguments.length; i++){ var c = arguments[i];
    if(Array.isArray(c)) c.forEach(function(x){ if(x != null && x !== false) e.append(x); });
    else if(c != null && c !== false) e.append(c); }
  return e;
}

  } else {
    var locked = s.phase === "feedback";
    card = h("section", {class:"card"}, h("p", {class:"where", text:where}), h("h2", {class:"q", id:"q", tabindex:"-1", text:s.p.q.q}), viewQuestion(locked), locked ? viewFeedback() : null);
    actions.push(locked
      ? h("button", {class:"btn btn-primary btn-big", type:"button", id:"main", text: s.queue.length ? "Continue" : "Finish", onclick:advance})
      : h("button", {class:"btn btn-primary btn-big", type:"button", id:"main", text:"Check", disabled:!ready(), onclick:check}));
  }
  var pct = s.phase === "intro" ? 0 : Math.round(s.resolved / s.total * 100);
  var hud = h("header", {class:"hud"},
    h("div", {class:"hud-row"},
      s.phase === "result" ? null : h("button", {class:"xbtn", type:"button", "aria-label":"Leave this stop", onclick:function(){ s.quit = !s.quit; renderPlay(); }}, icon("cross")),
      h("div", {class:"bar", role:"progressbar", "aria-label":"Progress in this stop", "aria-valuemin":"0", "aria-valuemax":"100", "aria-valuenow":String(pct)}, h("i", {style:"width:" + pct + "%"})),
      h("span", {class:"count", text:s.resolved + " of " + s.total})),
    chips());
  var quit = (s.quit && s.phase !== "result") ? h("div", {class:"confirm"}, h("span", {text:"Leave this stop? Your answers here will not be kept."}),
    h("button", {class:"btn btn-small", type:"button", text:"Leave", onclick:renderHome}),
    h("button", {class:"btn btn-small btn-primary", type:"button", text:"Keep playing", onclick:function(){ s.quit = false; renderPlay(); }})) : null;
  root.replaceChildren(hud, quit || "", card, h("div", {class:"p-actions"}, actions));
  if(s.phase === "question"){ if(s.fresh){ s.fresh = false; var qh = document.getElementById("q"); if(qh) qh.focus({preventScroll:true}); } }
  else { var m = document.getElementById("main"); if(m) m.focus({preventScroll: s.phase !== "feedback"}); }
}
document.addEventListener("keydown", function(e){
  if(!sess || e.metaKey || e.ctrlKey || e.altKey) return;
  if(sess.phase === "question" && sess.p.type === "choice"){
    var i = "1234".indexOf(e.key); if(i < 0) i = "abcd".indexOf(e.key.toLowerCase());
    if(i >= 0 && e.key.length === 1 && i < sess.p.opts.length){ sess.p.sel = i; renderPlay(); e.preventDefault(); return; }
  }
  var a = document.activeElement;
  if(e.key === "Enter" && sess.phase === "question" && ready() && !(a && a.id === "main")
     && !(a && a.tagName === "BUTTON" && sess.p.type !== "choice")){ check(); e.preventDefault(); }
});

applyPrefs();
renderHome();
initCloud();
</script>
</body>
